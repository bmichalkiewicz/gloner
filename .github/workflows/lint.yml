name: lint

on:
  push:
    tags-ignore:
    - "*"
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set-up go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set-up go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: build
      run: go build ./...

    - name: test
      run: go test -race ./...

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
